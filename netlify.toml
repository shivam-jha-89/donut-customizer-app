[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 5 needs Node 18 or newer
  NODE_VERSION = "20"

# The app uses HashRouter, so every route already loads index.html and this rule is not needed today.
# It keeps deep links working if you later switch to BrowserRouter (existing files are never overridden).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built files in /assets have hashed names, so browsers can cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
